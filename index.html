<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小吴手绘汽车</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
  <header class="site-header">
    <a class="brand" href="index.html">小吴手绘汽车</a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="lessons.html">课程</a>
    </nav>
  </header>
  <main class="container" id="app">
    <section class="hero">
      <h1>小吴手绘汽车</h1>
      <p>从比例到渲染，像设计师一样画车。</p>
      <img class="hero-car" src="assets/illustrations/lesson-04-step-05.svg" alt="一辆手绘小汽车">
      <a class="btn btn-primary" href="lessons.html">开始学习</a>
    </section>
    <section class="reference-note">
      <h2>手绘范例</h2>
      <img src="assets/reference/reference-drawing.jpg" alt="专业手绘汽车设计稿范例">
      <p>这是专业的手绘汽车设计稿。画的时候可以观察它的比例、线条和光影。</p>
    </section>
    <section class="photo-references">
      <h2>真实车型参考</h2>
      <p class="section-note">画之前先观察真车：车轮高度、车身长度、座舱位置——比例都在照片里。</p>
      <div class="photo-grid">
        <figure class="photo-card">
          <div class="photo-frame">
            <img src="assets/reference/car-photo-1.jpg" alt="特斯拉 Model 3 实车照片" loading="lazy">
            <div class="guide-line guide-h1"></div>
            <div class="guide-line guide-h2"></div>
            <div class="guide-line guide-v1"></div>
            <div class="guide-line guide-v2"></div>
          </div>
          <figcaption>Tesla Model 3 · 观察车身长度与车轮直径的比例</figcaption>
        </figure>
        <figure class="photo-card">
          <div class="photo-frame">
            <img src="assets/reference/car-photo-2.jpg" alt="特斯拉 Model S 实车照片" loading="lazy">
            <div class="guide-line guide-h1"></div>
            <div class="guide-line guide-h2"></div>
            <div class="guide-line guide-v1"></div>
            <div class="guide-line guide-v2"></div>
          </div>
          <figcaption>Tesla Model S · 观察低矮姿态与长轴距</figcaption>
        </figure>
        <figure class="photo-card">
          <div class="photo-frame">
            <img src="assets/reference/car-photo-3.jpg" alt="保时捷 911 实车照片" loading="lazy">
            <div class="guide-line guide-h1"></div>
            <div class="guide-line guide-h2"></div>
            <div class="guide-line guide-v1"></div>
            <div class="guide-line guide-v2"></div>
          </div>
          <figcaption>Porsche 911 · 经典跑车比例，观察前后悬与轮拱</figcaption>
        </figure>
      </div>
    </section>
    <section class="unit-map" id="unit-map" aria-label="课程地图"></section>
  </main>
  <footer class="site-footer">小吴手绘汽车 · 多画、多看、多思考</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
